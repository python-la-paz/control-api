name: Dev CI/CD
on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
jobs:

  lint:
    uses: ./.github/workflows/z-lint.yaml

  build:
    if: github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/dev-1-ci.yaml
    needs: lint
    with:
      environment: dev
      image_repository: ${{ vars.DOCKER_IMAGE }}
      push_image: ${{ github.event_name == 'push' }}
    secrets:
      gcp_sa_key: ${{ secrets.GCP_SA_KEY }}

  deploy:
    if: github.ref == 'refs/heads/dev'
    needs: build
    uses: ./.github/workflows/dev-2-cd.yaml
    with:
      environment: dev
      image_repository: ${{ vars.DOCKER_IMAGE }}
      image_tag: ${{ needs.build.outputs.image_tag }}
      deployment_repository: ${{ vars.ARGOCD_REPOSITORY }}
      deployment_ref: ${{ vars.ARGOCD_REF || 'main' }}
      image_repository_path: ${{ vars.ARGOCD_IMAGE_REPOSITORY_PATH || '.image.repository' }}
      image_tag_path: ${{ vars.ARGOCD_IMAGE_TAG_PATH || '.image.tag' }}
    secrets:
      token: ${{ secrets.ARGOCD_GH_TOKEN }}
